<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 575" role="img" aria-labelledby="title desc">
  <title id="title">Flare Scroll — organic wave transition</title>
  <desc id="desc">Dark scene with a smooth electric-blue wave rising into a light background.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050508"/>
      <stop offset=".43" stop-color="#0a102a"/>
      <stop offset=".63" stop-color="#2255a6"/>
      <stop offset=".82" stop-color="#65a9ee"/>
      <stop offset="1" stop-color="#f5fafe"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="105%" r="75%">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset=".32" stop-color="#adcefa" stop-opacity=".65"/>
      <stop offset=".70" stop-color="#3056b4" stop-opacity=".15"/>
      <stop offset="1" stop-color="#3056b4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="curve"><path d="M0 510 Q360 485 500 255 Q600 120 700 255 Q840 485 1200 510 L1200 575H0Z"/></clipPath>
    <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
  </defs>
  <rect width="1200" height="575" fill="#08090c"/>
  <path d="M-100 590 Q340 530 470 295 Q600 55 730 295 Q860 530 1300 590" fill="none" stroke="#2660d5" stroke-opacity=".56" stroke-width="160" filter="url(#blur)"/>
  <rect width="1200" height="575" fill="url(#sky)" clip-path="url(#curve)"/>
  <rect width="1200" height="575" fill="url(#light)" clip-path="url(#curve)"/>
  <text x="60" y="68" fill="#fff" font-size="21" font-family="Arial, Helvetica, sans-serif" font-weight="bold" letter-spacing="3">FLARE / SCROLL</text>
  <text x="60" y="103" fill="#bdc1ce" font-size="15" font-family="Arial, Helvetica, sans-serif">Scroll-driven · Configurable palette · WebGL</text>
</svg>
