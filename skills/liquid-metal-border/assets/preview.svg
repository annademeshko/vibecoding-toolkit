<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Liquid Metal Border — UI component study</title>
<desc id="desc">Illustrative dark theme of a large Liquid Metal title, one chrome-outlined button and an architectural editorial card with a chrome hover frame.</desc>
